[package]
name = "dust-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for the Dust scripting language"

[[bin]]
name = "dust-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
